plugins {
     id 'com.android.application'
}

// The upload key. Locally it comes from android/key.properties (gitignored:
// it holds passwords); on a build machine the same values arrive through
// KEYSTORE_PATH / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD.
// BACK THE KEYSTORE UP. Losing it means asking Play for an upload key reset
// before any further update can ship.
def keyProps = new Properties()
def keyPropsFile = rootProject.file('key.properties')
if (keyPropsFile.exists()) {
    keyPropsFile.withInputStream { keyProps.load(it) }
}
def signingValue = { String prop, String env -> keyProps.getProperty(prop) ?: System.getenv(env) }
def releaseKeystorePath = signingValue('storeFile', 'KEYSTORE_PATH')
def releaseKeystoreFile = releaseKeystorePath ? rootProject.file(releaseKeystorePath) : null

android {
    // The namespace names the Java classes and the generated R.
    namespace = "com.izzy2lost.a3do"
    compileSdk 36
    ndkVersion = "30.0.16248370"
    defaultConfig {
        // The application id is the app's identity on Play. Once a release is
        // published under it, it cannot change without becoming a second app:
        // installs, reviews and rating stay with the old id.
        applicationId "com.izzy2lost.a3do"
        minSdk 24
        targetSdk 36
        // Increment for each Play upload; version codes cannot be reused.
        versionCode 18
        versionName "2.1.4"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-24", "-DANDROID_STL=c++_static"
                // armeabi-v7a covers 32-bit phones and most Google TV and
                // Android TV devices, which run a 32-bit system even on 64-bit
                // chips. Play's app bundle hands each device only its own ABI.
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }
    signingConfigs {
        release {
            // Null when the key is absent, which makes a release build fail
            // at signing rather than quietly produce something the store
            // will reject. There are no default passwords to fall back on.
            storeFile releaseKeystoreFile?.exists() ? releaseKeystoreFile : null
            storePassword signingValue('storePassword', 'KEYSTORE_PASSWORD')
            keyAlias signingValue('keyAlias', 'KEY_ALIAS')
            keyPassword signingValue('keyPassword', 'KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    // The template's applicationVariants hook (which forced asset merging to wait
    // for the native build) was removed: AGP 9 dropped that API, and it only
    // mattered for the ndkBuild path this project does not use.
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        // CMake only. The whole emulator - SDL, ImGui, libchdr and the core -
        // is described once in the root CMakeLists, and jni/CMakeLists.txt is
        // a thin entry point into it. There is no second, Android-specific
        // description of the build to keep in step.
        externalNativeBuild {
            cmake {
                path 'jni/CMakeLists.txt'
            }
        }

    }
    packaging {
        jniLibs {
            // AdrenoTools installs its isolated Vulkan hook from the extracted
            // nativeLibraryDir. Android cannot provide that path when native
            // libraries remain compressed inside the APK.
            useLegacyPackaging = true
        }
    }
    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
